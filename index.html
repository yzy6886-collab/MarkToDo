<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>马克待办</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --surface: #0a0a0a;
      --surface-raised: #171717;
      --border: #2b2b2b;
      --text: #f5f5f5;
      --text-muted: #9d9d9d;
      --accent: #6ea8fe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      background: var(--surface);
      padding: 28px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
    }

    h1 {
      margin-top: 0;
      letter-spacing: 0.02em;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      font-size: 16px;
    }

    input {
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.18);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      background: var(--surface-raised);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #222222;
      border-color: #3a3a3a;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    li span {
      flex: 1;
    }

    li.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li.completed .due {
      text-decoration: none;
    }

    input[type="date"] {
      padding: 10px 12px;
      font-size: 16px;
    }

    li .due {
      flex: none;
      font-size: 14px;
      color: var(--text-muted);
    }

    li .due.overdue {
      color: #ff6b6b;
    }

    input[type="checkbox"] {
      flex: none;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    #stats {
      margin-bottom: 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>马克待办</h1>

    <div class="input-row">
      <input id="todoInput" type="text" placeholder="输入一个待办事项">
      <input id="dueInput" type="date">
      <button id="addButton">添加</button>
      <button id="sortButton">排序</button>
      <button id="completeAllButton">全部完成</button>
      <button id="clearCompletedButton">清空已完成</button>
      <button id="exportButton">导出</button>
    </div>

    <ul id="todoList"></ul>
    <p id="stats"></p>
  </div>

  <script>
    const todoInput = document.getElementById("todoInput");
    const addButton = document.getElementById("addButton");
    const todoList = document.getElementById("todoList");
    const sortButton = document.getElementById("sortButton");
    const stats = document.getElementById("stats");

    const dueInput = document.getElementById("dueInput");
    const completeAllButton = document.getElementById("completeAllButton");
    const clearCompletedButton = document.getElementById("clearCompletedButton");
    const exportButton = document.getElementById("exportButton");

    const todos = [
      { text: "关注「马克的技术工作坊」", completed: false },
      { text: "给这期 Git 教程点赞", completed: true }
    ];

    function isOverdue(todo) {
      if (!todo.due || todo.completed) {
        return false;
      }

      const today = new Date().toISOString().slice(0, 10);
      return todo.due < today;
    }

    function clearCompleted() {
      const remaining = todos.filter(todo => !todo.completed);

      todos.length = 0;
      todos.push(...remaining);

      renderTodos();
    }

    function exportTodos() {
      const lines = todos.map(todo => todo.text);

      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "马克待办.txt";
      link.click();
    }

    function completeAll() {
      todos.forEach(todo => {
        todo.completed = true;
      });

      renderTodos();
    }

    function renderTodos() {
      completeAllButton.disabled = todos.every(todo => todo.completed);
      todoList.innerHTML = "";

      todos.forEach((todo, index) => {
        const li = document.createElement("li");

        if (todo.completed) {
          li.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;

        checkbox.addEventListener("change", () => {
          todos[index].completed = checkbox.checked;
          renderTodos();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const due = document.createElement("span");
        due.className = "due";
        due.textContent = todo.due ? todo.due : "";
        if (isOverdue(todo)) {
          due.classList.add("overdue");
          due.textContent = todo.due + " 已过期";
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "删除";

        deleteButton.addEventListener("click", () => {
          todos.splice(index, 1);
          renderTodos();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(due);
        li.appendChild(deleteButton);

        todoList.appendChild(li);
      });

      const left = todos.filter(todo => !todo.completed).length;
      stats.textContent = `共 ${todos.length} 项，还剩 ${left} 项没完成`;
    }

    let sortAsc = true;

    function sortByDue() {
      todos.sort((a, b) => {
        if (!a.due) {
          return 1;
        }

        if (!b.due) {
          return -1;
        }

        return (a.due < b.due) === sortAsc ? -1 : 1;
      });

      sortButton.textContent = sortAsc ? "排序 ↑" : "排序 ↓";
      sortAsc = !sortAsc;

      renderTodos();
    }

    function addTodo() {
      const text = todoInput.value.trim();

      if (!text) {
        return;
      }

      todos.push({
        text,
        completed: false,
        due: dueInput.value
      });

      dueInput.value = "";
      todoInput.value = "";
      renderTodos();
    }

    addButton.addEventListener("click", addTodo);
    sortButton.addEventListener("click", sortByDue);

    completeAllButton.addEventListener("click", completeAll);
    clearCompletedButton.addEventListener("click", clearCompleted);
    exportButton.addEventListener("click", exportTodos);
    todoInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTodo();
      }
    });

    renderTodos();
  </script>
</body>
</html>
